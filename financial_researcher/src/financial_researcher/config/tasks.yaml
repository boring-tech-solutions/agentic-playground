research_task:
  description: >
    Conduct a thorough research about {company} in {current_year}, Focus on 
    1. Current company status and health
    2. Historical performance and key milestones
    3. Major challenges and opportunities
    4. Recent news and events
    5. Future outlook and potential developments
  expected_output: >
    A comprehensive search report document with well organized sections
    covering all the requested aspects of {company}. INclude specific facts, figures and examples
    where relevant.
  agent: researcher

analysis_task:
  description: >
    Analyze the research findings on {company} and compile them into a detailed report.
    The report should include:
    1. An executive summary highlighting key insights
    2. A detailed analysis of each aspect researched
    3. Visual aids such as charts or graphs to illustrate important data points
    4. Offer market outlook for the company, noting that this should be used for trading purposes.
    5. Key personnel involved in the company and their roles.
    6. Be formatted in a professional manner, easy to read and understand
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: analyst
  context:
    - research_task
  outputfile: output/report.md
