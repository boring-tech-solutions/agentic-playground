find_trending_companies:
  description: >
    Search the latest reputable financial and business news to identify up to {max_companies}
    publicly traded companies in the {sector} sector that are currently trending.
    Focus on:
      - Unusual news volume or significant recent events (earnings, M&A, funding, regulation, product launches).
      - Clear, recent catalysts within the last {lookback_days} days.
    If a list of previously selected companies is provided in context, avoid selecting those again.
    Return only companies for which there is sufficient, verifiable recent information.
  expected_output: >
    A compact JSON array of companies with the following fields for each item:
      - name
      - ticker (if available)
      - primary_exchange_or_market
      - country
      - reason (1–2 sentences)
      - top_headlines (up to 3 short titles with source names and dates)
  agent: trending_company_finder
  output_file: outputs/trending_companies.json

research_trending_companies:
  description: >
    Given the list of trending companies, perform a focused fundamental and news-based analysis 
    of each company using only recent, credible sources.
    Stay lean by:
      - Highlighting only the most decision-relevant facts (no generic company history).
      - Limiting each company to a concise summary, not an exhaustive report.
  expected_output: >
    A structured, markdown-formatted report where each company has:
      - Company snapshot (business model, main products/markets) in 2–3 sentences.
      - Recent catalysts (earnings, deals, news) in up to 5 bullet points with dates.
      - High-level financial snapshot (market cap, revenue trend, profitability if available).
      - Key upside drivers (3–5 bullets).
      - Key risks or red flags (3–5 bullets).
      - Overall risk profile (e.g., low / medium / high) with 1–2 sentence justification.
    Keep the analysis factual, concise, and directly useful for an investment decision.
  agent: financial_researcher
  context:
    - find_trending_companies
  output_file: outputs/research_report.json

pick_best_stock:
  description: >
    Using the research report, select a single best stock candidate for investment from the
    analyzed companies.
    Optimize for risk-adjusted return, clarity of thesis, and strength of recent catalysts,
    while avoiding highly speculative choices unless clearly justified.
    Stay lean by focusing on comparison of the top few candidates rather than re-summarizing
    all companies.
    Also draft a 1-sentence push notification summarizing the decision.
  expected_output: >
    A short markdown decision note containing:
      - Chosen_company: name and ticker.
      - 3–5 bullet points explaining the core investment thesis.
      - 2–3 bullet points explaining why it is preferred over the next best alternatives.
      - A brief risk disclaimer (1–2 sentences).
      - push_notification_text: a single sentence under 200 characters summarizing the pick and rationale.
  agent: stock_picker
  context:
    - research_trending_companies
  output_file: outputs/decision.md
